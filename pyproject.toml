[project]
name = "retina"
version = "1.0.0"
description = "An image tokenizer whose token count follows the image's content, on the FLUX.2 VAE; plus a small MAR model trained on its tokens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "diffusers==0.42.1",
    "transformers==5.20.1",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "pillow",
    "lpips",
    "pyarrow",
    "datasets",
    "click",
]

[project.optional-dependencies]
# DreamSim, for optional scoring outside the tokenizer
judges = ["dreamsim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retina", "mar"]
